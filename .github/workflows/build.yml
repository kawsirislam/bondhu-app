name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o android_bondhu_project.zip
      - name: Copy real google-services.json
        run: cp google-services.json android_app/app/google-services.json
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build APK
        run: |
          cd android_app
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-apk
          path: android_app/app/build/outputs/apk/debug/app-debug.apk
